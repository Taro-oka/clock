<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <main id="main-container">
      <div class="clock-outer">
        <span class="clock-number hidden" id="clock-number-1">1</span>
        <span class="clock-number hidden" id="clock-number-2">2</span>
        <span class="clock-number hidden" id="clock-number-3">3</span>
        <span class="clock-number hidden" id="clock-number-4">4</span>
        <span class="clock-number hidden" id="clock-number-5">5</span>
        <span class="clock-number hidden" id="clock-number-6">6</span>
        <span class="clock-number hidden" id="clock-number-7">7</span>
        <span class="clock-number hidden" id="clock-number-8">8</span>
        <span class="clock-number hidden" id="clock-number-9">9</span>
        <span class="clock-number hidden" id="clock-number-10">10</span>
        <span class="clock-number hidden" id="clock-number-11">11</span>
        <span class="clock-number hidden" id="clock-number-12">12</span>
        <div class="clock-core hidden">
          <div class="clock-hand clock-hand-hour"></div>
          <div class="clock-hand clock-hand-minute"></div>
          <div class="clock-hand clock-hand-second"></div>
        </div>
        <div class="clock-loading">読み込み中...</div>
      </div>
    </main>
    <script src="main.js" type="module"></script>
  </body>
</html>
